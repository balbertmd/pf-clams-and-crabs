name: CI - image auto-fix + build validator
# Astro-site variant (Nick's / PF). Two layers of image protection so a CMS/editor upload can
# never ship heavy OR bloat the repo, with ZERO burden on the editor (Keystatic is untouched):
#   Layer 1 (served output): `npm run build` runs compress-heavy-images.mjs before astro build,
#           so whatever gets deployed is always capped. (fail-open — never blocks a deploy.)
#   Layer 2 (repo hygiene, THIS workflow): on push, auto-compress any oversized raster and
#           commit the fixed original back, so the repo self-heals instead of just going red.
# Also validates the site compiles and scans for hardcoded secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Auto-compress oversized images in place (repo self-heals)
        if: github.event_name == 'push'
        run: node scripts/compress-heavy-images.mjs

      - name: Commit compressed originals back (only if something changed)
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "image-guard-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(images): auto-compress oversized upload [skip ci]"
            git push
            echo "self-healed: compressed originals committed back"
          else
            echo "no oversized images - nothing to commit"
          fi

      - name: Astro build (compiles or fails)
        run: npm run build

      - name: Secret guard (no hardcoded secrets)
        run: |
          if grep -rIn -E '(API_KEY|_SECRET|PASSWORD)[[:space:]]*[=:][[:space:]]*["'"'"'][A-Za-z0-9_\-]{12,}' --include='*.mjs' --include='*.ts' --include='*.astro' --include='*.toml' src scripts 2>/dev/null; then
            echo "possible hardcoded secret - keep secrets in Cloudflare"; exit 1
          fi
          echo "no hardcoded secrets"
