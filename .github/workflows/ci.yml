name: CI - image auto-fix + build validator
# Astro-site variant (Nick's / PF). Two layers of image protection so a CMS/editor upload can
# never ship heavy OR bloat the repo, with ZERO burden on the editor (Keystatic is untouched):
#   Layer 1 (served output): `npm run build` runs compress-heavy-images.mjs before astro build,
#           so whatever gets deployed is always capped. (fail-open — never blocks a deploy.)
#   Layer 2 (repo hygiene, THIS workflow): on push, auto-compress any oversized raster and
#           commit the fixed original back, so the repo self-heals instead of just going red.
# Also validates the site compiles and scans for hardcoded secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Fable audit H7: was `write` so a bot could push to main unattended.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Auto-compress oversized images in place (repo self-heals)
        if: github.event_name == 'push'
        run: node scripts/compress-heavy-images.mjs

      # Fable audit (H7): the bot used to push straight to main on a PUBLIC client site with no
      # branch protection and no human in the loop. It now reports instead of pushing. If a real
      # oversized original lands, a human compresses it - the served build is already capped by
      # the fail-open guard in `npm run build`, so nothing is urgent.
      - name: Report oversized originals (no auto-push)
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::oversized repo originals were compressed locally by the guard - commit them yourself"
            git --no-pager diff --stat
            git checkout -- .
          else
            echo "no oversized images"
          fi

      # Fable audit M10. Self-test FIRST: a gate that has not been proven to go red is decoration,
      # and a green no-op is exactly how the myfarm drill shipped. 12 mutations, each modelled on a
      # defect that actually reached this site - including the two found live on 2026-08-01
      # (deadAnchor: the 404 nav pointing at ids the homepage never had; hiddenContent: a CSS
      # source-order collision that left every block below the hero invisible on prod).
      - name: HTML gate - self-test (prove the gate still catches real defects)
        run: node tools/html-gate.selftest.mjs

      - name: HTML gate - scan shipped documents
        run: node tools/html-gate.mjs

      - name: Astro build (compiles or fails)
        run: npm run build

      # Fable audit 2026-07-27 (H7): the documented fail-loud --check mode was dead code that
      # nothing ever invoked, so CI could not actually go red on an oversized repo original.
      - name: Image guard - fail loud on PRs (check mode)
        if: github.event_name == 'pull_request'
        run: node scripts/compress-heavy-images.mjs --check

      # Fable audit (H7): the old guard scanned only src/ and scripts/ for 4 extensions, so it
      # never looked at public/index.html or public/dock-admin/index.html - where 100% of the
      # homepage work happens, on a PUBLIC repo. Now scans the whole tree including HTML.
      - name: Secret guard (no hardcoded secrets)
        run: |
          if grep -rIn -E '(API_KEY|_SECRET|PASSWORD|x-pf-key)[[:space:]]*[=:][[:space:]]*["'"'"'][A-Za-z0-9_\-]{12,}' \
              --include='*.mjs' --include='*.ts' --include='*.js' --include='*.astro' --include='*.toml' \
              --include='*.html' --include='*.json' --include='*.md' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              . 2>/dev/null; then
            echo "possible hardcoded secret - keep secrets in Cloudflare"; exit 1
          fi
          echo "no hardcoded secrets"
